<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }} &middot; Satellites</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .hint { color: var(--text-muted); font-size: 0.85rem; margin: 0 0 1rem; }

      .group-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
      .group-row:last-child { border-bottom: none; }
      .group-row label { display: flex; flex-direction: row; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text); font-weight: 600; }
      .group-row input[type="checkbox"] { width: auto; accent-color: var(--accent); }
      .group-row .count { color: var(--text-muted); font-weight: normal; }

      .satellites-toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
      .satellites-toolbar input[type="text"] { flex: 1 1 14rem; }
      .satellites-toolbar select { flex: 0 1 12rem; }
      .table-scroll { overflow-x: auto; }
      #satellites-table { min-width: 34rem; }
      #satellites-table th.group-col, #satellites-table td.group-col { text-align: center; white-space: nowrap; }
      #satellites-table td.group-col input[type="checkbox"] { width: auto; accent-color: var(--accent); }
      .age-fresh { color: var(--success); }
      .age-stale { color: var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <span class="dots"><span class="dot"></span><span class="dot dot2"></span></span>
      <h1>{{ app_name }}</h1>
      <nav class="nav-links">
        <a href="/settings" class="back-link">Settings</a>
        <a href="/" class="back-link">&larr; Dashboard</a>
      </nav>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>Groups</h2>
      </div>
      <p class="hint">
        Enabled groups' satellites show up in the Sky Tracking list on the dashboard.
        Pick which satellites belong to which group in the table below. TLE sources are managed
        on the <a href="/settings">Settings</a> page.
      </p>
      <div id="groups-list"></div>
      <form id="new-group-form" class="row" style="margin-top: 0.3rem;">
        <input id="new-group-name" type="text" placeholder="New group name" required />
        <button type="submit" class="btn-sm">Add group</button>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>All Satellites</h2>
        <span id="satellites-count" style="color: var(--text-muted); font-size: 0.85rem;"></span>
      </div>
      <div class="satellites-toolbar">
        <input id="satellites-filter" type="text" placeholder="Filter by name or NORAD id..." />
        <select id="satellites-source-filter">
          <option value="">All sources</option>
        </select>
      </div>
      <div class="table-scroll">
        <table id="satellites-table">
          <thead>
            <tr id="satellites-head-row">
              <th>Name</th><th>NORAD</th><th>Source</th><th>TLE age</th>
            </tr>
          </thead>
          <tbody id="satellites-body"></tbody>
        </table>
      </div>
    </section>

    <script src="/static/groups.js"></script>
  </body>
</html>
