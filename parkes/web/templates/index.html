<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .instrument-readout { display: flex; justify-content: space-evenly; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 0.8rem; }
      .instrument-readout .unit { font-weight: normal; color: var(--text-muted); }

      .instrument-dish { display: block; width: 100%; height: auto; }
      .elevation-dish { stroke: var(--accent2); stroke-width: 6; fill: none; stroke-linecap: round; }
      .elevation-boresight { stroke: var(--accent2); stroke-width: 3; stroke-linecap: round; }
      .az-marker { fill: var(--accent2); }

      .compass { position: relative; height: 3.4rem; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 1.4rem; }
      .compass-ticks { position: absolute; inset: 0; }
      .compass-tick { position: absolute; top: 0.65rem; }
      .compass-tick .line { position: absolute; top: 0; left: 0; width: 1px; height: 0.5rem; background: var(--border); transform: translateX(-0.5px); }
      .compass-tick.major .line { height: 0.85rem; background: var(--text-muted); }
      .compass-tick.cardinal .line { height: 1.05rem; width: 2px; background: var(--accent); transform: translateX(-1px); }
      .compass-tick.intercardinal .line { height: 0.95rem; width: 1.5px; background: var(--accent); opacity: 0.5; transform: translateX(-0.75px); }
      .compass-tick .label { position: absolute; top: 0.95rem; left: 0; transform: translateX(-50%); font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
      .compass-tick.cardinal .label { color: var(--accent); font-weight: 700; }
      .compass-tick.intercardinal .label { color: var(--accent); opacity: 0.55; font-weight: 600; }

      .control-row { display: flex; gap: 1.75rem; align-items: flex-start; flex-wrap: wrap; }
      .control-side { display: flex; flex-direction: column; gap: 0.6rem; flex: 1 1 12rem; min-width: 12rem; }

      .jog-grid { display: grid; grid-template-columns: repeat(3, 3rem); grid-template-rows: repeat(3, 3rem); gap: 0.4rem; }
      .jog-grid button { width: 3rem; height: 3rem; border-radius: 50%; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; padding: 0; }

      #goto-form { display: flex; flex-direction: column; gap: 0.6rem; }
      .goto-fields { display: flex; gap: 0.6rem; }
      .goto-fields label { flex: 1; min-width: 0; }

      .log-preview {
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.78rem; color: var(--text-muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 0 0.8rem;
      }

      button.back-link { background: none; border: none; padding: 0; cursor: pointer; font: inherit; }
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
        display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem;
      }
      .modal-dialog {
        background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
        padding: 1.2rem; width: 100%; max-width: 26rem; max-height: 90vh; overflow-y: auto;
        box-shadow: var(--shadow);
      }
      .modal-mode-row { display: flex; gap: 1.2rem; margin: 0.8rem 0 1rem; }
      .modal-mode-row label { display: flex; align-items: center; gap: 0.35rem; font-weight: 600; font-size: 0.9rem; }
      .modal-mode-row input[type="radio"] { width: auto; accent-color: var(--accent); }
      .location-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 0.6rem; }
      .location-fields input:disabled { opacity: 0.5; }
    </style>
  </head>
  <body>
    <header>
      <span class="dots"><span class="dot"></span><span class="dot dot2"></span></span>
      <h1>{{ app_name }}</h1>
      <nav class="nav-links">
        <button id="location-btn" class="back-link" type="button">&#128205; Location</button>
        <a href="/orchestrator" class="back-link">Pass Orchestrator</a>
        <a href="/settings" class="back-link">Settings</a>
      </nav>
    </header>

    <div class="page-grid">
    <section class="card">
      <div class="card-header">
        <h2>Rotator</h2>
        <span class="status-pill"><span class="status-dot" id="rotator-dot"></span><span id="rotator-status"></span></span>
      </div>

      <div class="instrument-readout">
        <span>Azimuth: <span id="rotator-heading">--</span><span class="unit">&deg;</span></span>
        <span>Elevation: <span id="rotator-el">--</span><span class="unit">&deg;</span></span>
      </div>

      <svg class="instrument-dish" viewBox="0 0 400 110" preserveAspectRatio="none" aria-label="Elevation indicator">
        <g id="elevation-dish-group">
          <path class="elevation-dish" d="M 0 -35 Q -22 0 0 35" />
          <line class="elevation-boresight" x1="0" y1="0" x2="15" y2="0" />
        </g>
        <polygon class="az-marker" points="200,110 194,101 206,101" />
      </svg>

      <div class="compass" id="rotator-compass">
        <div class="compass-ticks" id="compass-ticks"></div>
      </div>

      <hr class="divider" />

      <div class="control-row">
        <div class="jog-grid">
          <span></span>
          <button data-jog="up">&uarr;</button>
          <span></span>
          <button data-jog="left">&larr;</button>
          <span></span>
          <button data-jog="right">&rarr;</button>
          <span></span>
          <button data-jog="down">&darr;</button>
          <span></span>
        </div>

        <div class="control-side">
          <button id="park-btn" class="btn-block">Park</button>
          <form id="goto-form">
            <div class="goto-fields">
              <label>Az <input id="goto-az" type="number" step="0.1" value="0" required /></label>
              <label>El <input id="goto-el" type="number" step="0.1" value="0" required /></label>
            </div>
            <button type="submit" class="primary btn-block">Go</button>
          </form>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Sky Tracking</h2>
        <span class="status-pill"><span class="status-dot" id="tracking-dot"></span><span id="tracking-status"></span></span>
      </div>
      <div class="row">
        <button id="stop-tracking-btn" disabled>Stop tracking</button>
        <a href="/satellites" class="back-link">Manage satellite groups &rarr;</a>
      </div>
      <table>
        <thead>
          <tr><th>Target</th><th>Az</th><th>El</th><th>Status</th><th>Next pass</th><th></th></tr>
        </thead>
        <tbody id="targets-body"></tbody>
      </table>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Pass Orchestrator</h2>
        <span class="status-pill"><span class="status-dot" id="orchestrator-dot"></span><span id="orchestrator-status"></span></span>
      </div>
      <p class="log-preview" id="orchestrator-last-line">&nbsp;</p>
      <a href="/orchestrator" class="back-link">Manage orchestrator &rarr;</a>
    </section>
    </div>

    <div id="location-modal-overlay" class="modal-overlay">
      <div class="modal-dialog">
        <div class="card-header">
          <h2>Observer Location</h2>
          <button id="location-modal-close" type="button" class="btn-sm">&times;</button>
        </div>
        <div class="modal-mode-row">
          <label><input type="radio" name="location-mode" id="location-mode-default" /> Default</label>
          <label><input type="radio" name="location-mode" id="location-mode-manual" /> Manual</label>
        </div>
        <p class="hint" id="location-default-hint"></p>
        <div class="location-fields" id="location-manual-fields">
          <label>Latitude <input id="location-manual-lat" type="number" step="0.0001" /></label>
          <label>Longitude <input id="location-manual-lon" type="number" step="0.0001" /></label>
          <label>Elevation (m) <input id="location-manual-elev" type="number" step="1" /></label>
        </div>
        <p class="hint" id="location-geocode-hint">&nbsp;</p>
        <div class="row" style="margin-top: 0.6rem;">
          <button id="location-use-browser-btn" type="button" class="btn-sm">&#128205; Use my location</button>
        </div>
        <p class="hint" id="location-status"></p>
        <div class="row" style="margin-top: 1rem;">
          <button id="location-save-btn" class="primary" type="button">Save</button>
          <button id="location-cancel-btn" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <script src="/static/rotator.js"></script>
    <script src="/static/tracking.js"></script>
    <script src="/static/orchestrator-status.js"></script>
    <script src="/static/location.js"></script>
  </body>
</html>
