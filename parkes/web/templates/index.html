<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .position-row { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; margin-bottom: 1.4rem; }
      .position-col { flex: 1 1 14rem; min-width: 14rem; }
      .position-col.elevation-col { flex: 0 0 auto; width: 11rem; min-width: 0; }
      .position-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); text-align: center; margin-bottom: 0.25rem; }

      .heading-value { text-align: center; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 0.4rem; }
      .heading-value .unit { font-size: 1rem; color: var(--text-muted); font-weight: normal; }

      .compass { position: relative; height: 3.4rem; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
      .compass-marker {
        position: absolute; left: 50%; top: 0; width: 0; height: 0; z-index: 2;
        border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid var(--accent2);
        transform: translateX(-5px);
      }
      .compass-ticks { position: absolute; inset: 0; }
      .compass-tick { position: absolute; top: 0.65rem; }
      .compass-tick .line { position: absolute; top: 0; left: 0; width: 1px; height: 0.5rem; background: var(--border); transform: translateX(-0.5px); }
      .compass-tick.major .line { height: 0.85rem; background: var(--text-muted); }
      .compass-tick.cardinal .line { height: 1.05rem; width: 2px; background: var(--accent); transform: translateX(-1px); }
      .compass-tick .label { position: absolute; top: 0.95rem; left: 0; transform: translateX(-50%); font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
      .compass-tick.cardinal .label { color: var(--accent); font-weight: 700; }

      .elevation-widget { width: 11rem; margin: 0 auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 0.4rem; }
      .elevation-widget svg { display: block; width: 100%; height: auto; }
      .elevation-scale line { stroke: var(--text-muted); stroke-width: 2; }
      .elevation-scale text { fill: var(--text-muted); font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
      #elevation-dish-group .elevation-dish { stroke: var(--accent2); stroke-width: 8; fill: none; stroke-linecap: round; }
      #elevation-dish-group .elevation-boresight { stroke: var(--accent2); stroke-width: 5; stroke-linecap: round; }

      .control-row { display: flex; gap: 1.75rem; align-items: flex-start; flex-wrap: wrap; }
      .control-side { display: flex; flex-direction: column; gap: 0.6rem; flex: 1 1 12rem; min-width: 12rem; }

      .jog-grid { display: grid; grid-template-columns: repeat(3, 3rem); grid-template-rows: repeat(3, 3rem); gap: 0.4rem; }
      .jog-grid button { width: 3rem; height: 3rem; border-radius: 50%; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; padding: 0; }

      #goto-form { display: flex; flex-direction: column; gap: 0.6rem; }
      .goto-fields { display: flex; gap: 0.6rem; }
      .goto-fields label { flex: 1; min-width: 0; }

      .log-preview {
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.78rem; color: var(--text-muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 0 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dots"><span class="dot"></span><span class="dot dot2"></span></span>
      <h1>{{ app_name }}</h1>
    </header>

    <div class="page-grid">
    <section class="card">
      <div class="card-header">
        <h2>Rotator</h2>
        <span class="status-pill"><span class="status-dot" id="rotator-dot"></span><span id="rotator-status"></span></span>
      </div>

      <div class="position-row">
        <div class="position-col">
          <div class="position-label">Azimuth</div>
          <p class="heading-value"><span id="rotator-heading">--</span><span class="unit">&deg;</span></p>
          <div class="compass" id="rotator-compass">
            <div class="compass-marker"></div>
            <div class="compass-ticks" id="compass-ticks"></div>
          </div>
        </div>
        <div class="position-col elevation-col">
          <div class="position-label">Elevation</div>
          <p class="heading-value"><span id="rotator-el">--</span><span class="unit">&deg;</span></p>
          <div class="elevation-widget">
            <svg viewBox="0 0 200 200" aria-label="Elevation indicator">
              <g class="elevation-scale">
                <line x1="120" y1="140" x2="132" y2="140" />
                <text x="140" y="140">0&deg;</text>
                <line x1="111.96" y1="110" x2="122.35" y2="104" />
                <text x="129.28" y="100">30&deg;</text>
                <line x1="90" y1="88.04" x2="96" y2="77.65" />
                <text x="100" y="70.72">60&deg;</text>
                <line x1="60" y1="80" x2="60" y2="68" />
                <text x="60" y="60">90&deg;</text>
              </g>
              <g id="elevation-dish-group">
                <path class="elevation-dish" d="M 60 90 Q 25 140 60 190" />
                <line class="elevation-boresight" x1="60" y1="140" x2="78" y2="140" />
              </g>
            </svg>
          </div>
        </div>
      </div>

      <hr class="divider" />

      <div class="control-row">
        <div class="jog-grid">
          <span></span>
          <button data-jog="up">&uarr;</button>
          <span></span>
          <button data-jog="left">&larr;</button>
          <span></span>
          <button data-jog="right">&rarr;</button>
          <span></span>
          <button data-jog="down">&darr;</button>
          <span></span>
        </div>

        <div class="control-side">
          <button id="park-btn" class="btn-block">Park</button>
          <form id="goto-form">
            <div class="goto-fields">
              <label>Az <input id="goto-az" type="number" step="0.1" value="0" required /></label>
              <label>El <input id="goto-el" type="number" step="0.1" value="0" required /></label>
            </div>
            <button type="submit" class="primary btn-block">Go</button>
          </form>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Sky Tracking</h2>
        <span class="status-pill"><span class="status-dot" id="tracking-dot"></span><span id="tracking-status"></span></span>
      </div>
      <div class="row">
        <button id="stop-tracking-btn" disabled>Stop tracking</button>
        <a href="/satellites" class="back-link">Manage satellite groups &rarr;</a>
      </div>
      <table>
        <thead>
          <tr><th>Target</th><th>Az</th><th>El</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="targets-body"></tbody>
      </table>
    </section>
    </div>

    <section class="card">
      <div class="card-header">
        <h2>Satdump Autotrack</h2>
        <span class="status-pill"><span class="status-dot" id="satdump-dot"></span><span id="satdump-status"></span></span>
      </div>
      <p class="log-preview" id="satdump-last-line">&nbsp;</p>
      <a href="/satdump" class="back-link">Manage satdump &rarr;</a>
    </section>

    <script src="/static/rotator.js"></script>
    <script src="/static/tracking.js"></script>
    <script src="/static/satdump-status.js"></script>
  </body>
</html>
