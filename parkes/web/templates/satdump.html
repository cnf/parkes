<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }} &middot; Satdump</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      #satdump-log {
        width: 100%; height: 22rem; overflow-y: auto; margin: 0;
        background: #0d0e10; color: #d7d7da; border: 1px solid var(--border); border-radius: 8px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.78rem; line-height: 1.5;
        padding: 0.75rem; white-space: pre-wrap;
      }
      .downlink-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
      .downlink-row input[type="number"] { width: 9.5rem; }
      .downlink-row input[type="text"] { width: 8.5rem; }
      .downlink-row select { width: 9.5rem; }
      .downlink-row-head span { flex: 0 0 auto; }
      .downlink-row-head span:nth-child(1) { width: 9.5rem; }
      .downlink-row-head span:nth-child(2) { width: 8.5rem; }
      .downlink-row-head span:nth-child(3) { width: 9.5rem; }
      .downlink-flag { display: flex; align-items: center; gap: 0.25rem; font-size: 0.8rem; color: var(--text-muted); }
      .downlink-flag input { width: auto; accent-color: var(--accent); }
      .tracked-norad { color: var(--text-muted); font-weight: normal; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <header>
      <span class="dots"><span class="dot"></span><span class="dot dot2"></span></span>
      <h1>{{ app_name }}</h1>
      <nav class="nav-links">
        <a href="/orchestrator" class="back-link">Pass Orchestrator</a>
        <a href="/settings" class="back-link">Settings</a>
        <a href="/" class="back-link">&larr; Dashboard</a>
      </nav>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>Satdump Autotrack</h2>
        <span class="status-pill"><span class="status-dot" id="satdump-dot"></span><span id="satdump-status"></span></span>
      </div>
      <div class="row">
        <button id="satdump-start-btn" class="primary">Start</button>
        <button id="satdump-stop-btn" disabled>Stop</button>
      </div>
      <div class="field-label">Tracked Satellites</div>
      <p class="hint">
        Feeds both Satdump Autotrack (via each downlink's satdump pipeline id) and the
        <a href="/orchestrator">Pass Orchestrator</a> (via its app profile -- manage those there).
        Disable an entry to keep its config without deleting it.
      </p>
      <div id="tracked-list"></div>
      <div class="group-search">
        <input id="tracked-search-input" type="text" placeholder="Search satellites to add..." autocomplete="off" />
        <div id="tracked-search-results" class="search-results" style="display: none;"></div>
      </div>
      <div class="row" style="margin-top: 0.6rem;">
        <button id="satdump-save-objects-btn" class="primary">Save objects</button>
        <span id="satdump-objects-status" style="color: var(--text-muted); font-size: 0.85rem;"></span>
      </div>

      <hr class="divider" />

      <pre id="satdump-log"></pre>
    </section>

    <script src="/static/satdump.js"></script>
  </body>
</html>
