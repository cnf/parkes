[project]
name = "parkes"
version = "0.1.0"
description = "Web app for driving a motorized parabolic dish -- rotator control, satellite/radio tracking, and SDR/satdump orchestration"
authors = [{ name = "Frank Rosquin" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139",
    "uvicorn>=0.51",
    "websockets>=16.1",
    "jinja2>=3.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.2",
    "skyfield>=1.54",
]

[project.optional-dependencies]
dev = ["ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parkes"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# socket.setdefaulttimeout()/logging setup deliberately runs before the
# imports that need it in effect -- see the comments at the top of the file.
"parkes/main.py" = ["E402"]
