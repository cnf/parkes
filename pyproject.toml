[project]
name = "parkes"
version = "0.1.0"
description = "Web app for driving a motorized parabolic dish -- rotator control, satellite/radio tracking, and SDR/satdump orchestration"
authors = [{ name = "Frank Rosquin" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139",
    "uvicorn>=0.51",
    "websockets>=16.1",
    "jinja2>=3.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.2",
    "skyfield>=1.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parkes"]
