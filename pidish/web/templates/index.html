<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ app_name }}</title>
    <style>
      body { font-family: sans-serif; max-width: 32rem; margin: 2rem auto; }
      .jog-grid { display: grid; grid-template-columns: repeat(3, 3rem); gap: 0.25rem; margin: 1rem 0; }
      .jog-grid button { font-size: 1.25rem; }
      #rotator-status, #tracking-status, #satdump-status { color: #666; font-size: 0.9rem; }
      table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      th, td { text-align: left; padding: 0.25rem 0.5rem; border-bottom: 1px solid #ddd; }
      #satdump-objects { width: 100%; height: 10rem; font-family: monospace; box-sizing: border-box; }
      #satdump-log { width: 100%; height: 12rem; overflow-y: auto; background: #111; color: #ddd;
        font-family: monospace; font-size: 0.8rem; padding: 0.5rem; box-sizing: border-box; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>{{ app_name }}</h1>

    <h2>Rotator</h2>
    <p>
      Az: <span id="rotator-az">--</span>&deg;
      El: <span id="rotator-el">--</span>&deg;
      <span id="rotator-status"></span>
    </p>

    <div class="jog-grid">
      <span></span>
      <button data-jog="up">&uarr;</button>
      <span></span>
      <button data-jog="left">&larr;</button>
      <span></span>
      <button data-jog="right">&rarr;</button>
      <span></span>
      <button data-jog="down">&darr;</button>
      <span></span>
    </div>

    <p><button id="park-btn">Park</button></p>

    <form id="goto-form">
      <label>Az <input id="goto-az" type="number" step="0.1" value="0" required /></label>
      <label>El <input id="goto-el" type="number" step="0.1" value="0" required /></label>
      <button type="submit">Go</button>
    </form>

    <h2>Sky Tracking</h2>
    <p>
      <span id="tracking-status"></span>
      <button id="stop-tracking-btn" disabled>Stop tracking</button>
    </p>
    <table>
      <thead>
        <tr><th>Target</th><th>Az</th><th>El</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="targets-body"></tbody>
    </table>

    <h2>Satdump Autotrack</h2>
    <p>
      <span id="satdump-status"></span>
      <button id="satdump-start-btn">Start</button>
      <button id="satdump-stop-btn" disabled>Stop</button>
    </p>
    <p>
      Tracked objects (JSON):<br />
      <textarea id="satdump-objects"></textarea><br />
      <button id="satdump-save-objects-btn">Save objects</button>
      <span id="satdump-objects-status"></span>
    </p>
    <pre id="satdump-log"></pre>

    <script src="/static/rotator.js"></script>
    <script src="/static/tracking.js"></script>
    <script src="/static/satdump.js"></script>
  </body>
</html>
